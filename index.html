<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 도구 모음</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --border: #e3e7ec;
    --text: #1f2a37;
    --muted: #6b7684;
    --accent: #2f5d7c;
    --accent-soft: #e8eff5;
    --fun: #3f7d6b;
    --fun-soft: #e7f2ee;
    --news: #2f5d7c;
    --news-soft: #e8eff5;
    --work: #6a5a8c;
    --work-soft: #efecf5;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .04);
    --shadow-hover: 0 4px 16px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a1f;
      --surface: #1e242b;
      --border: #2c343d;
      --text: #e4e8ec;
      --muted: #97a1ad;
      --accent: #8fb6d3;
      --fun: #8cc7b4;
      --fun-soft: #213029;
      --news: #8fb6d3;
      --news-soft: #1f2b35;
      --work: #b7a8d6;
      --work-soft: #2a2636;
      --shadow: none;
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 24px; }

  header { padding: 64px 0 40px; }
  header .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
  }
  header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin-top: 8px; color: var(--muted); font-size: 16px; }

  main { flex: 1; padding-bottom: 64px; }
  section { margin-bottom: 40px; }
  .section-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-head .dot { width: 8px; height: 8px; border-radius: 50%; }
  .section-head h2 { font-size: 17px; font-weight: 700; }
  .section-head .count { font-size: 13px; color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    text-decoration: none; color: inherit;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: var(--cat);
    outline: none;
  }
  .icon {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--cat-soft); color: var(--cat);
  }
  .icon svg { width: 22px; height: 22px; }
  .body { flex: 1; min-width: 0; }
  .title { font-size: 15px; font-weight: 600; }
  .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .arrow { color: var(--muted); transition: transform .15s ease, color .15s ease; }
  .card:hover .arrow { transform: translateX(3px); color: var(--cat); }
  .ext {
    font-size: 11px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; margin-left: 6px; vertical-align: 1px;
  }

  .fun  { --cat: var(--fun);  --cat-soft: var(--fun-soft); }
  .news { --cat: var(--news); --cat-soft: var(--news-soft); }
  .work { --cat: var(--work); --cat-soft: var(--work-soft); }

  footer {
    border-top: 1px solid var(--border);
    padding: 20px 0; font-size: 13px; color: var(--muted);
  }

  @media (max-width: 560px) {
    header { padding: 44px 0 28px; }
    header h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">Toolbox</div>
    <h1>업무 도구 모음</h1>
    <p>자주 쓰는 도구를 한곳에서 바로 실행하세요.</p>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- 재미 -->
    <section class="fun">
      <div class="section-head">
        <span class="dot" style="background:var(--fun)"></span>
        <h2>재미</h2><span class="count">3</span>
      </div>
      <div class="grid">
        <a class="card fun" href="사다리타기.html">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v18M18 3v18M6 8h12M6 16h12M12 8v8"/></svg>
          </div>
          <div class="body">
            <div class="title">사다리타기</div>
            <div class="desc">공정하게 순서와 당첨자 정하기</div>
          </div>
          <span class="arrow">→</span>
        </a>
        <a class="card fun" href="룰렛추첨기.html">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M12 12L3.5 9.5"/></svg>
          </div>
          <div class="body">
            <div class="title">룰렛추첨기</div>
            <div class="desc">룰렛을 돌려 무작위 추첨</div>
          </div>
          <span class="arrow">→</span>
        </a>
        <a class="card fun" href="https://script.google.com/macros/s/AKfycby5GdYQrSa44KdVoyqasjhO9BS4PgUdl_xkTZWbTJGh595-TfHir82OgP-j-UJBJhqEUg/exec" target="_blank" rel="noopener">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </div>
          <div class="body">
            <div class="title">날씨기반 점심고르기<span class="ext">외부</span></div>
            <div class="desc">오늘 날씨에 어울리는 메뉴 추천</div>
          </div>
          <span class="arrow">↗</span>
        </a>
      </div>
    </section>

    <!-- 뉴스 -->
    <section class="news">
      <div class="section-head">
        <span class="dot" style="background:var(--news)"></span>
        <h2>뉴스</h2><span class="count">1</span>
      </div>
      <div class="grid">
        <a class="card news" href="https://script.google.com/macros/s/AKfycbybMp122Sw4yXb1R0DZZ4SK-R8fyjR2uql8FjMsba5yQjePoV7tkIubYAn-gBUl2UhH/exec" target="_blank" rel="noopener">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
          </div>
          <div class="body">
            <div class="title">한전뉴스대시보드<span class="ext">외부</span></div>
            <div class="desc">한국전력 관련 최신 뉴스 모아보기</div>
          </div>
          <span class="arrow">↗</span>
        </a>
      </div>
    </section>

    <!-- 업무 -->
    <section class="work">
      <div class="section-head">
        <span class="dot" style="background:var(--work)"></span>
        <h2>업무</h2><span class="count">1</span>
      </div>
      <div class="grid">
        <a class="card work" href="PDF병합도구.html">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M12 11v6"/></svg>
          </div>
          <div class="body">
            <div class="title">PDF 병합도구</div>
            <div class="desc">여러 PDF 파일을 하나로 합치기</div>
          </div>
          <span class="arrow">→</span>
        </a>
      </div>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">© <span id="y"></span> 업무 도구 모음</div>
</footer>

<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
